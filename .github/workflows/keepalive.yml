name: Keep API awake

# The API runs on a free Render instance, which spins down after ~15 minutes of
# inactivity and then needs 30-60s to answer its next request. Anyone opening the
# live link during that window waits out a cold start. Pinging the health route
# keeps the instance up through the hours people actually look at it.
#
# Deliberately not 24/7: a free Render account gets 750 instance-hours a month
# and a month is ~730 hours, so an always-awake service would eat the entire
# allowance and starve every other free service on the account. This window is
# ~16h/day, which still leaves real headroom. The window is Mountain Time; cron
# has no DST awareness, so it drifts an hour in winter, which is harmless.
#
# Two known limits, both harmless: GitHub's scheduler is best-effort and runs can
# drift by several minutes under load, and GitHub disables scheduled workflows
# after 60 days without repository activity. Either way a missed ping costs one
# slow request, not correctness.

on:
  schedule:
    - cron: "*/10 14-23,0-5 * * *" # every 10 min, 14:00-05:59 UTC (08:00-23:59 Mountain)
  workflow_dispatch: # manual wake-up before sharing the link

jobs:
  ping:
    name: Ping the API
    runs-on: ubuntu-latest
    steps:
      # --max-time is generous on purpose: a ping that lands on a sleeping
      # instance IS the wake-up, so that request is the one that has to wait.
      - name: Wake the backend
        run: >
          curl --silent --show-error --fail
          --max-time 120 --retry 2 --retry-delay 20
          https://campuslens-qpr8.onrender.com/
